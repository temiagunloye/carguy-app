<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLB Renderer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #ffffff;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Global state
        let scene, camera, renderer, model, controls;
        const RENDER_WIDTH = 1920;
        const RENDER_HEIGHT = 1080;

        function init() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);

            // Camera
            camera = new THREE.PerspectiveCamera(45, RENDER_WIDTH / RENDER_HEIGHT, 0.1, 1000);
            camera.position.set(5, 2, 8);

            // Renderer
            renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: false,
                preserveDrawingBuffer: true // Required for screenshots
            });
            renderer.setSize(RENDER_WIDTH, RENDER_HEIGHT);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            // Studio Lighting Setup
            setupLighting();

            // Floor
            const floorGeometry = new THREE.PlaneGeometry(100, 100);
            const floorMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: 0.8,
                metalness: 0.1
            });
            const floor = new THREE.Mesh(floorGeometry, floorMaterial);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Controls (for debugging)
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Signal ready
            window.rendererReady = true;
            console.log('Renderer initialized');
        }

        function setupLighting() {
            // Ambient light
            const ambient = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambient);

            // Key light (main)
            const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
            keyLight.position.set(5, 10, 7);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            keyLight.shadow.camera.near = 0.5;
            keyLight.shadow.camera.far = 50;
            keyLight.shadow.camera.left = -10;
            keyLight.shadow.camera.right = 10;
            keyLight.shadow.camera.top = 10;
            keyLight.shadow.camera.bottom = -10;
            scene.add(keyLight);

            // Fill light
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
            fillLight.position.set(-5, 5, -5);
            scene.add(fillLight);

            // Rim/Back light
            const rimLight = new THREE.DirectionalLight(0xffffff, 0.8);
            rimLight.position.set(0, 5, -10);
            scene.add(rimLight);
        }

        window.loadModel = async function (url) {
            return new Promise((resolve, reject) => {
                const loader = new GLTFLoader();
                loader.load(
                    url,
                    (gltf) => {
                        // Remove old model if exists
                        if (model) {
                            scene.remove(model);
                        }

                        model = gltf.scene;

                        // Enable shadows
                        model.traverse((node) => {
                            if (node.isMesh) {
                                node.castShadow = true;
                                node.receiveShadow = true;
                            }
                        });

                        // Center and scale model
                        const box = new THREE.Box3().setFromObject(model);
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());

                        model.position.x = -center.x;
                        model.position.y = -box.min.y; // Place on floor
                        model.position.z = -center.z;

                        // Scale to reasonable size (target ~3 units tall)
                        const maxDim = Math.max(size.x, size.y, size.z);
                        const targetSize = 3;
                        const scale = targetSize / maxDim;
                        model.scale.setScalar(scale);

                        scene.add(model);

                        // Adjust camera to see the whole model
                        const scaledSize = size.multiplyScalar(scale);
                        const distance = Math.max(scaledSize.x, scaledSize.z) * 2.5;
                        camera.position.set(distance * 0.7, scaledSize.y * 0.8, distance);
                        camera.lookAt(0, scaledSize.y * 0.5, 0);

                        controls.target.set(0, scaledSize.y * 0.5, 0);
                        controls.update();

                        console.log('Model loaded successfully');
                        resolve(true);
                    },
                    undefined,
                    (error) => {
                        console.error('Error loading model:', error);
                        reject(error);
                    }
                );
            });
        };

        window.setCameraAngle = function (angleDegrees, distance = null) {
            if (!model) return;

            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = new THREE.Vector3(0, size.y * 0.5, 0);

            if (!distance) {
                distance = Math.max(size.x, size.z) * 2.5;
            }

            const angleRad = (angleDegrees * Math.PI) / 180;
            const x = distance * Math.sin(angleRad);
            const z = distance * Math.cos(angleRad);
            const y = size.y * 0.8;

            camera.position.set(x, y, z);
            camera.lookAt(center);
            controls.target.copy(center);
            controls.update();
        };

        window.renderFrame = function () {
            controls.update();
            renderer.render(scene, camera);
        };

        window.getScreenshot = function () {
            renderer.render(scene, camera);
            return renderer.domElement.toDataURL('image/png');
        };

        // Start
        init();

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>

</html>
