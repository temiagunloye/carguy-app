<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage Manager 3D Viewer</title>
    <style>
        body {
            margin: 0;
            background: #0a0a0a;
            color: #eee;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 300px;
            pointer-events: none;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        .stat {
            font-size: 14px;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            background: #22c55e;
            color: #fff;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            margin-top: 10px;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>

<body>
    <div id="ui">
        <h1>Garage Manager 3D</h1>
        <div id="job-info">
            <div class="stat" id="job-id">Loading job...</div>
            <div class="stat" id="poses-count">-- poses registered</div>
        </div>
        <div class="badge">REAL_MODE ACTIVE</div>
        <div id="debug-info"
            style="margin-top: 15px; font-family: monospace; font-size: 11px; color: #aaa; border-top: 1px solid #333; padding-top: 10px;">
            <div>Proxy: <span id="proxy-url">--</span></div>
            <div>BBox: <span id="proxy-bbox">--</span></div>
            <div>MaxDim: <span id="proxy-maxdim">--</span></div>
            <div>Scale: <span id="proxy-scale">--</span></div>
        </div>
    </div>
    <div id="canvas-container"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="js/viewer.js"></script>
</body>

</html>
