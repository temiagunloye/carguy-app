<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Simulator | Garage Manager</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/visualizer.css">
</head>

<body>

    <div class="visualizer-container">

        <!-- Left Panel: Configuration -->
        <div class="hud-panel hud-left">
            <div class="hud-panel-header">
                <span style="display:flex; align-items:center; gap:8px;"><i data-lucide="sliders-horizontal"
                        style="width:16px;"></i> CONFIGURATION</span>
                <!-- Exit Link Removed -->
            </div>

            <div class="hud-panel-content">
                <!-- Vehicle Selection (Sticky at top of content) -->
                <div class="control-group">
                    <label class="control-label">VEHICLE</label>
                    <select id="vehicle-selector" class="vehicle-select">
                        <option value="" disabled selected>Select Base Car...</option>
                    </select>
                </div>

                <!-- Config Tabs -->
                <div class="config-tabs">
                    <div class="config-tab active" onclick="switchTab('wrap')">Paint</div>
                    <div class="config-tab" onclick="switchTab('wheels')">Wheels</div>
                    <div class="config-tab" onclick="switchTab('parts')">Parts</div>
                    <div class="config-tab" onclick="switchTab('builds')">Builds</div>
                </div>

                <!-- Tab Content: Wrap -->
                <div id="tab-wrap" class="tab-content active">
                    <div class="control-group">
                        <label class="control-label">WRAP / PAINT</label>
                        <div id="wrap-selector" class="color-grid">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>

                <!-- Tab Content: Wheels -->
                <div id="tab-wheels" class="tab-content">
                    <div class="control-group">
                        <label class="control-label">WHEELS</label>
                        <div id="wheels-selector" class="wheels-grid">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>

                <!-- Tab Content: Parts -->
                <div id="tab-parts" class="tab-content">
                    <div class="control-group">
                        <label class="control-label">INSTALLED PARTS</label>
                        <div id="parts-list">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>

                <!-- Tab Content: Builds -->
                <div id="tab-builds" class="tab-content">
                    <div class="control-group">
                        <label class="control-label">COMMUNITY BUILDS</label>
                        <div id="builds-gallery">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>


            </div>
        </div>

        <!-- Center Panel: Viewer -->
        <div class="hud-center">
            <div class="viewer-canvas">
                <img id="main-vehicle-image" src="https://via.placeholder.com/1600x900?text=Select+Vehicle+to+Start"
                    alt="Vehicle Preview" class="vehicle-image">

                <button class="nav-arrow nav-prev" onclick="prevAngle()">❮</button>
                <button class="nav-arrow nav-next" onclick="nextAngle()">❯</button>


            </div>

            <!-- Angle Navigation Dots -->
            <div class="angle-nav">
                <div class="angle-dot active" onclick="setAngle(0)"></div>
                <div class="angle-dot" onclick="setAngle(1)"></div>
                <div class="angle-dot" onclick="setAngle(2)"></div>
                <div class="angle-dot" onclick="setAngle(3)"></div>
                <div class="angle-dot" onclick="setAngle(4)"></div>
                <div class="angle-dot" onclick="setAngle(5)"></div>
                <div class="angle-dot" onclick="setAngle(6)"></div>
                <div class="angle-dot" onclick="setAngle(7)"></div>
                <div class="angle-dot" onclick="setAngle(8)"></div>
                <div class="angle-dot" onclick="setAngle(9)"></div>
            </div>
        </div>

        <!-- Right Panel Removed as per user request -->
    </div>

    <!-- Styles for 2-column layout -->
    <style>
        .visualizer-container {
            display: grid !important;
            grid-template-columns: 320px 1fr !important;
            /* Override to 2 columns */
        }
    </style>

    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>lucide.createIcons();</script>
    <script type="module" src="/js/visualizer-v3.js?v=CANONICAL_V103"></script>
</body>

</html>
